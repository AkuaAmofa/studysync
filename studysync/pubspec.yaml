name: studysync
description: "StudySync - A real-time study group finder for Ashesi University students."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  # Plus Jakarta Sans font (no local font files needed)
  google_fonts: ^6.1.0

  # Maps & Location
  google_maps_flutter: ^2.5.0
  geolocator: ^11.0.0

  # State Management & Navigation
  flutter_riverpod: ^2.5.1
  go_router: ^13.0.0

  # Networking
  http: ^1.2.0
  dio: ^5.4.1

  # Storage
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.0.0

  # Media
  image_picker: ^1.0.7
  cached_network_image: ^3.3.1

  # Firebase
  firebase_core: ^2.27.0
  firebase_messaging: ^14.7.10

  # Notifications
  flutter_local_notifications: ^17.0.0

  # Device / Background
  sensors_plus: ^4.0.2
  workmanager: ^0.9.0+3

  # Utilities
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
